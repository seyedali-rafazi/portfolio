<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="srBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- S Blue Gradient -->
    <linearGradient id="srBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#248aff" />
      <stop offset="100%" stop-color="#0066e6" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="srShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" flood-color="#090d16" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect
    x="3"
    y="3"
    width="94"
    height="94"
    rx="24"
    fill="url(#srBgGrad)"
    stroke="rgba(22, 131, 255, 0.25)"
    stroke-width="2.5"
    filter="url(#srShadow)"
  />

  <!-- Letters: S is Blue, R is Black -->
  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="-2">
    <!-- S in Blue -->
    <text x="21" y="66" fill="url(#srBlueGrad)">S</text>
    <!-- R in Black -->
    <text x="50" y="66" fill="#090d16">R</text>
  </g>
</svg>
