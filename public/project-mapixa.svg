<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mapixaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b18"/>
      <stop offset="50%" stop-color="#0e142c"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="indigoGlow" cx="20%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="npmRedGlow" cx="85%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#cb3837" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#cb3837" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="geoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#312e81" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="0" cy="0" r="1.5" fill="#6366f1" fill-opacity="0.4"/>
    </pattern>

    <!-- Window Border & Glass Fill -->
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="windowFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Polygon Fill Gradient -->
    <linearGradient id="polyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#mapixaBg)"/>

  <!-- Radial Background Lighting -->
  <rect width="800" height="450" fill="url(#indigoGlow)"/>
  <rect width="800" height="450" fill="url(#cyanGlow)"/>
  <rect width="800" height="450" fill="url(#npmRedGlow)"/>

  <!-- Geographic Coordinate Grid Lines -->
  <rect width="800" height="450" fill="url(#geoGrid)"/>

  <!-- Curving Topo Contour Lines in Background -->
  <g stroke="#4f46e5" stroke-opacity="0.15" stroke-width="1.2" fill="none">
    <path d="M -50 120 C 150 80, 280 200, 480 140 C 680 80, 750 180, 850 150"/>
    <path d="M -50 180 C 120 140, 260 260, 460 200 C 660 140, 720 250, 850 210"/>
    <path d="M -50 250 C 180 220, 310 320, 520 280 C 700 240, 780 340, 850 300"/>
    <path d="M -50 320 C 140 280, 350 400, 560 350 C 720 310, 800 400, 850 380"/>
  </g>

  <!-- Main Showcase Container Window -->
  <g transform="translate(60, 38)" filter="url(#boxShadow)">
    <!-- Outer Glow Rim -->
    <rect x="-1" y="-1" width="682" height="374" rx="18" fill="none" stroke="url(#windowBorder)" stroke-width="1.5" stroke-opacity="0.85"/>
    <!-- Window Body -->
    <rect width="680" height="372" rx="17" fill="url(#windowFill)"/>

    <!-- Map Window Header Bar -->
    <rect width="680" height="42" rx="17" fill="#131b2e" fill-opacity="0.9"/>
    <path d="M 0 42 L 680 42" stroke="#1e293b" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="60" cy="21" r="5.5" fill="#10b981" fill-opacity="0.85"/>

    <!-- Window Title & Breadcrumb -->
    <text x="86" y="25" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">
      mapixa <tspan fill="#64748b">/ react-maplibre-tools</tspan>
    </text>

    <!-- Version Badge in Header -->
    <g transform="translate(565, 10)">
      <rect width="95" height="22" rx="6" fill="#cb3837" fill-opacity="0.2" stroke="#cb3837" stroke-width="1" stroke-opacity="0.5"/>
      <text x="47" y="15" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">npm v1.0.8</text>
    </g>

    <!-- Map Area Canvas Mockup -->
    <!-- Landmass Polygons Background Simulation -->
    <g fill="#1a233a" fill-opacity="0.6" stroke="#2a3655" stroke-width="1">
      <path d="M 40 100 Q 120 70 200 110 T 360 90 T 520 130 T 640 80 L 640 370 L 40 370 Z"/>
      <path d="M 80 180 Q 190 150 280 220 T 450 190 T 600 240" fill="none" stroke="#25324d" stroke-width="1.5" stroke-dasharray="4,4"/>
    </g>

    <!-- GIS Feature 1: Geodesic Drawn Polygon with Area Label -->
    <g>
      <polygon points="110,130 250,110 320,180 230,260 120,220" fill="url(#polyGradient)" stroke="#818cf8" stroke-width="2.5" filter="url(#neonGlow)"/>
      <!-- Vertices handles -->
      <circle cx="110" cy="130" r="4.5" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
      <circle cx="250" cy="110" r="4.5" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
      <circle cx="320" cy="180" r="4.5" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
      <circle cx="230" cy="260" r="4.5" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
      <circle cx="120" cy="220" r="4.5" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>

      <!-- Calculated Metric Badge for Polygon -->
      <g transform="translate(165, 170)">
        <rect width="90" height="24" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2"/>
        <circle cx="14" cy="12" r="3" fill="#a5b4fc"/>
        <text x="24" y="16" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">38.4 km²</text>
      </g>
    </g>

    <!-- GIS Feature 2: Geodesic Circle with Radius Indicator -->
    <g>
      <circle cx="460" cy="240" r="75" fill="url(#circleGradient)" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,4"/>
      <circle cx="460" cy="240" r="4" fill="#06b6d4"/>
      <!-- Radius Line -->
      <line x1="460" y1="240" x2="525" y2="202" stroke="#22d3ee" stroke-width="1.8"/>
      <circle cx="525" cy="202" r="3.5" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
      <g transform="translate(470, 205)">
        <rect width="66" height="20" rx="10" fill="#082f49" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1"/>
        <text x="33" y="14" fill="#67e8f9" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">r = 5.2 km</text>
      </g>
    </g>

    <!-- GIS Feature 3: Polyline Distance Ruler -->
    <g>
      <polyline points="290,290 380,310 470,335" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4"/>
      <circle cx="290" cy="290" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
      <circle cx="380" cy="310" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
      <circle cx="470" cy="335" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
      <g transform="translate(340, 280)">
        <rect width="72" height="20" rx="10" fill="#451a03" fill-opacity="0.95" stroke="#f59e0b" stroke-width="1"/>
        <text x="36" y="14" fill="#fde68a" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">12.8 km</text>
      </g>
    </g>

    <!-- GIS Feature 4: High-Tech Custom SVG Pinpoint Marker with Pulse -->
    <g transform="translate(370, 110)">
      <circle cx="0" cy="0" r="18" fill="#ef4444" fill-opacity="0.25"/>
      <circle cx="0" cy="0" r="10" fill="#ef4444" fill-opacity="0.45"/>
      <!-- Pin SVG Shape -->
      <path d="M 0 -22 C -9 -22 -14 -16 -14 -7 C -14 4 0 16 0 16 C 0 16 14 4 14 -7 C 14 -16 9 -22 0 -22 Z" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="0" cy="-10" r="4" fill="#ffffff"/>
    </g>

    <!-- Floating Mapixa Tool Accordion Bar (Top Right) -->
    <g transform="translate(585, 60)" filter="url(#boxShadow)">
      <!-- Main Toolbar Container -->
      <rect width="75" height="250" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
      
      <!-- Toolbar Header -->
      <rect width="75" height="26" rx="14" fill="#1e293b"/>
      <text x="37" y="17" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1" text-anchor="middle">DRAW</text>

      <!-- Tool Icons (Marker, Polyline, Polygon, Circle, Rectangle, Ruler, Eraser) -->
      <!-- Marker (Active) -->
      <g transform="translate(14, 34)">
        <rect width="47" height="26" rx="7" fill="#6366f1" fill-opacity="0.3" stroke="#818cf8" stroke-width="1"/>
        <circle cx="23" cy="11" r="4" fill="#818cf8"/>
        <path d="M 23 15 L 23 19" stroke="#818cf8" stroke-width="1.5"/>
      </g>

      <!-- Polyline -->
      <g transform="translate(14, 66)">
        <rect width="47" height="26" rx="7" fill="#1e293b" fill-opacity="0.7"/>
        <path d="M 12 18 L 22 9 L 34 16" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
        <circle cx="12" cy="18" r="2" fill="#94a3b8"/>
        <circle cx="22" cy="9" r="2" fill="#94a3b8"/>
        <circle cx="34" cy="16" r="2" fill="#94a3b8"/>
      </g>

      <!-- Polygon -->
      <g transform="translate(14, 98)">
        <rect width="47" height="26" rx="7" fill="#1e293b" fill-opacity="0.7"/>
        <polygon points="14,19 23,8 33,12 28,20" fill="#6366f1" fill-opacity="0.4" stroke="#a5b4fc" stroke-width="1.5"/>
      </g>

      <!-- Circle -->
      <g transform="translate(14, 130)">
        <rect width="47" height="26" rx="7" fill="#1e293b" fill-opacity="0.7"/>
        <circle cx="23" cy="13" r="7" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      </g>

      <!-- Rectangle -->
      <g transform="translate(14, 162)">
        <rect width="47" height="26" rx="7" fill="#1e293b" fill-opacity="0.7"/>
        <rect x="15" y="6" width="17" height="14" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      </g>

      <!-- Ruler -->
      <g transform="translate(14, 194)">
        <rect width="47" height="26" rx="7" fill="#1e293b" fill-opacity="0.7"/>
        <path d="M 13 18 L 33 8" stroke="#fbbf24" stroke-width="1.5"/>
        <path d="M 17 14 L 19 18 M 23 11 L 25 15 M 29 8 L 31 12" stroke="#fbbf24" stroke-width="1.2"/>
      </g>

      <!-- Eraser -->
      <g transform="translate(14, 224)">
        <rect width="47" height="20" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="23" y="14" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ERASE</text>
      </g>
    </g>

    <!-- Floating Navigation & Basemap Switcher (Top Left) -->
    <g transform="translate(20, 56)">
      <rect width="135" height="32" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="6" fill="#3b82f6" fill-opacity="0.3"/>
      <path d="M 16 12 L 18 16 L 16 20 L 14 16 Z" fill="#60a5fa"/>
      <text x="32" y="20" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Basemap: Dark</text>
    </g>

    <!-- Bottom Left Live Coordinate Capsule -->
    <g transform="translate(20, 324)">
      <rect width="195" height="30" rx="15" fill="#0f172a" fill-opacity="0.95" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#22c55e" fill-opacity="0.8"/>
      <text x="30" y="20" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="600">35.6892° N, 51.3890° E</text>
    </g>

    <!-- Bottom Right NPM Install Command Banner -->
    <g transform="translate(365, 320)">
      <rect width="195" height="36" rx="10" fill="#180b20" fill-opacity="0.95" stroke="#a855f7" stroke-width="1.2"/>
      <!-- NPM Red Tag -->
      <rect x="8" y="8" width="38" height="20" rx="4" fill="#cb3837"/>
      <text x="27" y="22" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle">npm</text>
      <!-- Command -->
      <text x="56" y="23" fill="#f5d0fe" font-family="monospace" font-size="13" font-weight="700">npm i mapixa</text>
    </g>
  </g>

  <!-- Title & Subtitle Branding at Bottom -->
  <g transform="translate(80, 432)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">MAPIXA</text>
    <text x="65" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">— Pure CSS &amp; TypeScript GIS Drawing Suite for MapLibre &amp; React</text>
  </g>
</svg>
